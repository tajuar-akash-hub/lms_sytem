services:
  - type: web
    name: chat-with-video
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PLAYLIST_ID
        value: PLLlxv6oRta6CTZ2KilPHuc1oQ9PMTKOug
      - key: PYTHON_VERSION
        value: 3.12.4

